name: Test Sky YouTube via Tor Italy

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yt-dlp and Tor
        run: |
          python -m pip install -U "yt-dlp[default]"
          sudo apt-get update
          sudo apt-get install -y tor

      - name: Configure Tor Italy
        run: |
          echo "ExitNodes {it}" | sudo tee -a /etc/tor/torrc
          echo "StrictNodes 1" | sudo tee -a /etc/tor/torrc
          sudo systemctl restart tor
          sleep 15

      - name: Check Tor exit
        run: |
          echo "=== IP USCITA TOR ==="
          curl --proxy socks5h://127.0.0.1:9050 https://ipinfo.io/json

      - name: Test Sky TG24 through Tor
        run: |
          yt-dlp \
            -v \
            --proxy "socks5://127.0.0.1:9050" \
            --extractor-args "youtube:player_client=android" \
            -F "https://www.youtube.com/watch?v=DBkiOifHkVE"
