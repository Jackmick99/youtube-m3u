name: Test Sky YouTube Geo

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yt-dlp
        run: |
          python -m pip install -U "yt-dlp[default]"

      - name: Test Sky TG24 con geobypass Italia
        run: |
          yt-dlp \
            -v \
            --xff IT \
            --extractor-args "youtube:player_client=android" \
            -F "https://www.youtube.com/watch?v=DBkiOifHkVE"
