name: Update YouTube M3U8

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp with EJS
        run: |
          python -m pip install -U "yt-dlp[default]"

      - name: Show versions
        run: |
          deno --version
          yt-dlp --version

      - name: Update playlist
        run: |
          python update.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube.m3u8
          git diff --cached --quiet || git commit -m "Update YouTube stream"
          git push
