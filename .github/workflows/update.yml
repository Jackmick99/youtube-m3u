name: Update YouTube M3U8

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp and PO Token provider
        run: |
          python -m pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          cd bgutil-ytdlp-pot-provider/server
          deno install --allow-scripts=npm:canvas --frozen

      - name: Test Sky TG24
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies-test.txt
          echo "=== VERSIONE YT-DLP ==="
          yt-dlp --version
          echo "=== TEST SKY TG24 CON VISIONOS ==="
          yt-dlp -v --extractor-args "youtube:player_client=visionos" -F "https://www.youtube.com/watch?v=DBkiOifHkVE"
          rm -f cookies-test.txt

      - name: Update playlist
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python update.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add *.m3u8
          git diff --cached --quiet || git commit -m "Update YouTube stream"
          git push
